<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">
  <title>Risk Management & Safety Dashboard</title>
  <link rel="icon" href="https://lh3.googleusercontent.com/d/1cEiGM22LPYbLY24n5ASbs_hM6201xXnX" type="image/png">
  <style>html,body{margin:0;height:100%;overflow:hidden}iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}</style>
</head>
<body>
  <iframe id="app" title="Risk Management & Safety Dashboard" allow="clipboard-write"></iframe>
  <noscript>กรุณาเปิดใช้งาน JavaScript หรือเข้าที่ <a href="https://script.google.com/macros/s/AKfycbysyO99b4MFpR2Hh62Q32O2LlrQhPDOmmJnwF31J2L6RnXG6pRAEgqS6vAGFoL6qRk1Bw/exec">ลิงก์ระบบโดยตรง</a></noscript>
  <script>
  /* หน้าครอบ (wrapper) ของระบบ: ฝัง Google Apps Script Web app ด้วย iframe
     ส่งต่อพารามิเตอร์ ?reset=โทเค็น (ลิงก์ตั้งรหัสผ่านใหม่จากอีเมล) และ ?login=1 เข้าไปในระบบ
     — เดิม iframe ชี้ไป /exec ตายตัว พารามิเตอร์จากอีเมลจึงไม่ถึงระบบ ฟอร์มตั้งรหัสผ่านใหม่จึงไม่ขึ้น */
  (function () {
    var EXEC = 'https://script.google.com/macros/s/AKfycbysyO99b4MFpR2Hh62Q32O2LlrQhPDOmmJnwF31J2L6RnXG6pRAEgqS6vAGFoL6qRk1Bw/exec';
    var q = new URLSearchParams(location.search), out = new URLSearchParams(), rs = q.get('reset');
    if (rs && /^[A-Za-z0-9-]{20,60}$/.test(rs)) out.set('reset', rs);        // ส่งต่อเฉพาะที่ระบบใช้ และตรวจรูปแบบโทเค็นก่อน
    if (q.get('login') === '1') out.set('login', '1');
    var s = out.toString();
    document.getElementById('app').src = EXEC + (s ? '?' + s : '');
    if (s) { try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }   // ล้างพารามิเตอร์ออกจากแถบที่อยู่ → กดรีโหลดแล้วไม่วนกลับมาฟอร์มตั้งรหัสผ่าน/หน้า login ซ้ำ
  })();
  </script>
</body>
</html>
